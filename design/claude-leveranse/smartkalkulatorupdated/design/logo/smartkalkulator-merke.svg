<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="sk-t">
  <title id="sk-t">Smartkalkulator</title>
  <defs>
    <linearGradient id="sk-body" x1="24" y1="10" x2="72" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20293d"/>
      <stop offset=".55" stop-color="#141c2c"/>
      <stop offset="1" stop-color="#0a111e"/>
    </linearGradient>
    <linearGradient id="sk-screen" x1="31" y1="22" x2="65" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04222c"/>
      <stop offset="1" stop-color="#062733"/>
    </linearGradient>
    <linearGradient id="sk-edge" x1="24" y1="10" x2="72" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".6" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="sk-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sk-glow-s" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="sk-bolt" d="M13.6 2 4.9 14.4h5.5L8.6 22l8.9-12.6h-5.6z"/>
  </defs>

  <g transform="rotate(-7 48 48)">
    <!-- kalkulatorhus med kuttet hjørne -->
    <g filter="url(#sk-glow)">
      <path d="M32 11h25.2L75 28.8V74a11 11 0 0 1-11 11H32a11 11 0 0 1-11-11V22a11 11 0 0 1 11-11z"
            fill="url(#sk-body)" stroke="url(#sk-edge)" stroke-width="2.6" stroke-linejoin="round"/>
    </g>
    <!-- kuttlinje i hjørnet -->
    <path d="M57.2 11v17.8H75" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linejoin="round" opacity=".55"/>

    <!-- skjerm -->
    <g filter="url(#sk-glow-s)">
      <rect x="30" y="21.5" width="36" height="17" rx="4.5"
            fill="url(#sk-screen)" stroke="#22d3ee" stroke-width="1.8"/>
    </g>
    <use href="#sk-bolt" transform="translate(41.4 24.2) scale(.56)" fill="#a5f3fc" filter="url(#sk-glow-s)"/>

    <!-- tastatur -->
    <g fill="#26334a">
      <rect x="30" y="46" width="9.5" height="8" rx="2.4"/>
      <rect x="43.2" y="46" width="9.5" height="8" rx="2.4"/>
      <rect x="56.5" y="46" width="9.5" height="8" rx="2.4"/>
      <rect x="30" y="57.5" width="9.5" height="8" rx="2.4"/>
      <rect x="43.2" y="57.5" width="9.5" height="8" rx="2.4"/>
      <rect x="56.5" y="57.5" width="9.5" height="8" rx="2.4"/>
      <rect x="30" y="69" width="9.5" height="8" rx="2.4"/>
      <rect x="43.2" y="69" width="9.5" height="8" rx="2.4"/>
    </g>
    <rect x="56.5" y="69" width="9.5" height="8" rx="2.4" fill="#22d3ee" filter="url(#sk-glow-s)"/>
  </g>

  <!-- gnist -->
  <use href="#sk-bolt" transform="translate(74.5 6.5) scale(.72)" fill="none" stroke="#67e8f9"
       stroke-width="2.4" stroke-linejoin="round" filter="url(#sk-glow-s)"/>
</svg>
